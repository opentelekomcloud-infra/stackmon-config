apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: status-dashboard

images:
  - name: sd3-frontend
    newName: quay.io/stackmon/status-dashboard-v3-front
    newTag: 1.1.0

resources:
  - ../../base

patchesStrategicMerge:
  - |-
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: sd3-frontend-ingress
      annotations:
        # The site is served from the OBS static website bucket. OBS selects the bucket by
        # Host header only and ignores SNI, so upstream-vhost carries the endpoint while
        # backend-protocol upgrades the proxy_pass scheme to HTTPS.
        nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
        nginx.ingress.kubernetes.io/upstream-vhost: "status.obs-website.eu-de.otc.t-systems.com"
        nginx.ingress.kubernetes.io/configuration-snippet: |
          more_set_headers "X-Frame-Options: DENY";
          more_set_headers "Content-Security-Policy: frame-ancestors 'none'";
    spec:
      rules:
        - host: status.otc-service.com
          http:
            paths:
            - path: /
              pathType: Prefix
              backend:
                service:
                  name: sd3-frontend
                  port:
                    number: 80

      tls:
      - hosts:
        - status.otc-service.com
        secretName: sd3-front-cert-prod
  # The bucket is the origin now, so the Service becomes an alias for its website
  # endpoint. An ExternalName Service must not carry a selector.
  - |-
    apiVersion: v1
    kind: Service
    metadata:
      name: sd3-frontend
    spec:
      type: ExternalName
      externalName: status.obs-website.eu-de.otc.t-systems.com
      selector: null
      ports:
        - protocol: TCP
          port: 80
          targetPort: 443
