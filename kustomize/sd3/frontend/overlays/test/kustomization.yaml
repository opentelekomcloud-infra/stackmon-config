apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sd3-test

images:
  - name: sd3-frontend
    newName: quay.io/stackmon/status-dashboard-v3-front
    newTag: sha-b0f4f3d

resources:
  - ../../base

patchesStrategicMerge:
  - |-
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: sd3-frontend-ingress
      annotations:
        # The site is served from the OBS static website bucket. OBS picks the
        # bucket by Host header only and ignores SNI, so upstream-vhost carries
        # the endpoint while backend-protocol upgrades the proxy_pass scheme.
        nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
        nginx.ingress.kubernetes.io/upstream-vhost: "status-dashboard-test.obs-website.eu-de.otc.t-systems.com"
        nginx.ingress.kubernetes.io/configuration-snippet: |
          more_set_headers "X-Frame-Options: DENY";
          more_set_headers "Content-Security-Policy: frame-ancestors 'none'";
          location ~ ^/rss {
            return 301 https://api.test.status.otc-service.com$request_uri;
          }
          # OBS answers 404 for SPA routes that are not bucket keys; the
          # in-cluster nginx used to return 200 for them, so keep that.
          proxy_intercept_errors on;
          error_page 404 =200 /index.html;
    spec:
      rules:
        - host: test.status.otc-service.com
          http:
            paths:
            - path: /
              pathType: Prefix
              backend:
                service:
                  name: sd3-frontend
                  port:
                    number: 80
      tls:
      - hosts:
        - test.status.otc-service.com
        secretName: sd3-front-cert-test
  - |-
    apiVersion: v1
    kind: Service
    metadata:
      name: sd3-frontend
    spec:
      type: ExternalName
      externalName: status-dashboard-test.obs-website.eu-de.otc.t-systems.com
      selector: null
      ports:
        - protocol: TCP
          port: 80
          targetPort: 443
