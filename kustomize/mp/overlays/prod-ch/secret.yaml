apiVersion: v1
kind: Secret
metadata:
  name: metrics-processor-oidc
  labels:
    app.kubernetes.io/name: metrics-processor
    app.kubernetes.io/component: convertor-reporter
type: Opaque
stringData:
  # Block scalar: the substituted value is a JSON document full of double quotes,
  # which would break a double-quoted YAML scalar. AVP selects the field with '#'.
  # EU and CH share the same Zitadel project/client and sd_reporters role;
  # only the Status Dashboard URL differs, so this profile is intentionally shared.
  service-account.json: |
    <path:secret/data/stackmon/metrics-processor-prod#zitadel-profile>
